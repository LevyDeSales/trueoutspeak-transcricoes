name: Verificação

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run verify
        env:
          TRUEOUTSPEAK_BASELINE_MODE: ${{ github.event_name == 'pull_request' && 'merge-base' || github.event_name == 'push' && 'direct' || '' }}
          TRUEOUTSPEAK_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
          TRUEOUTSPEAK_BASELINE_FALLBACK_REF: ${{ github.event_name == 'push' && format('origin/{0}', github.event.repository.default_branch) || '' }}
      - run: npm run sync:check
      - run: npm ci
      - run: npm test
